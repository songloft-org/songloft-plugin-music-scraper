name: Package Plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main commit to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and validate the plugin
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: music-scraper
          path: dist/music-scraper.jsplugin.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-plugin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build, validate and publish the plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-plugin.mjs
